# Proximity Voice - server config
# Voice audio travels inside the normal Minecraft connection, so there is NO extra port to open.
# Use /voice reload after editing this file.

# Turn voice chat on/off for the whole server.
enabled=true

# How far (in blocks) a player's voice can be heard. Players further away get nothing sent to them.
max-distance=48.0

# Voices are full volume up to this distance, then fade out until max-distance.
fade-start-distance=8.0

# If false, players in spectator mode can only be heard by other spectators.
spectators-heard-by-everyone=false

# Anti-spam limit for voice packets per player (a talking player sends 50 per second).
max-packets-per-second=75

# Tell Java players who join without the mod that voice chat exists.
notify-players-without-mod=true

# Message for Java players without the mod. Use & color codes.
no-mod-message=&7This server has &aproximity voice chat&7! Install the &fProximity Voice&7 Fabric mod to talk and listen (press &fJ&7 for settings).

# Tell Bedrock (Geyser/Floodgate) players that voice is Java-only.
notify-bedrock-players=true

# Message for Bedrock players. Use & color codes.
bedrock-message=&7This server has proximity voice chat, but it only works for Java Edition players with the mod. Bedrock can't send or play custom voice audio.

