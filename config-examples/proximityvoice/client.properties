# Proximity Voice - client config
# You can change all of this in-game: press J (change the key in Options > Controls > Key Binds).

# Send your microphone to nearby players.
microphone-enabled=true

# Hear nearby players.
speaker-enabled=true

# always-on = mic is live whenever you speak (default)
# push-to-talk = only while holding the Push to Talk key (default V)
activation-mode=always-on

# Microphone boost in percent (0-300).
microphone-volume=100

# Volume of other players in percent (0-200).
speaker-volume=100

# Always-on mode only: sound quieter than this (dBFS) is not sent, so you don't stream silence/background hiss.
# -80 = gate off (mic sends everything). Higher = less sensitive. Range -80 to -10.
noise-gate-db=-50

# Microphone device name. Empty = system default.
input-device=

# Speaker/headphone device name. Empty = system default.
output-device=

